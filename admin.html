<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>말씀 문답 신고 관리</title><link rel="stylesheet" href="safety.css"></head><body><main>
<h1>말씀 문답 신고 관리</h1><p>한영혼선교회 관리자 전용</p>
<form id="login" class="card"><label for="email">관리자 이메일</label><input type="email" id="email" required autocomplete="username"><label for="password">비밀번호</label><input type="password" id="password" required autocomplete="current-password"><div class="actions"><button id="login-button" disabled>로그인</button><button type="button" id="reset" class="secondary" disabled>비밀번호 재설정 메일</button></div></form>
<div id="toolbar" class="actions" hidden><button id="refresh">새로고침</button><button id="prepare" class="secondary">최초 설정: 기존 닉네임 예약</button><button id="logout" class="secondary">로그아웃</button></div>
<p id="status" class="status" role="status">연결 준비 중…</p><div id="reports"></div><button id="more" hidden>다음 50건</button>
<p class="muted">신고를 확인한 뒤 조치하세요. 신고했다고 자동 제재하지 않습니다. “임시 이름 + 변경 제한”은 이름 수정만 제한하며 계정이나 학습 기록을 삭제하지 않습니다. 안내는 사용자가 앱을 열어 연결했을 때 표시됩니다.</p>
</main><script type="module" src="admin.js"></script></body></html>
